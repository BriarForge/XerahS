name: Product Contract

# No path filters: TOOL-EFFECTIVE-001 requires an effective-instructions
# report for every changed path, and the checks run in seconds.
on:
  pull_request:
  push:

jobs:
  linux-qt:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install the Linux reference toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ qt6-base-dev qt6-image-formats-plugins \
            fonts-dejavu-core zlib1g-dev libsqlite3-dev python3 dbus-daemon poppler-utils
      - uses: actions/checkout@v4
      - name: Prepare the desktop test user
        run: |
          useradd --create-home xerahs-ci
          chown -R xerahs-ci:xerahs-ci "$GITHUB_WORKSPACE"
      - name: Configure native Linux
        run: runuser -u xerahs-ci -- cmake -S platforms/linux/linux-qt -B platforms/linux/linux-qt/build -G Ninja
      - name: Verify effect regressions before the full build
        run: |
          runuser -u xerahs-ci -- cmake --build platforms/linux/linux-qt/build --target EffectGoldenHash-test --parallel 2
          runuser -u xerahs-ci -- env QT_QPA_PLATFORM=offscreen \
            XERAHS_EFFECT_DIAGNOSTICS="$GITHUB_WORKSPACE/platforms/linux/linux-qt/build/effect-diagnostics" \
            "$GITHUB_WORKSPACE/platforms/linux/linux-qt/build/EffectGoldenHash-test"
      - name: Build native Linux
        run: runuser -u xerahs-ci -- cmake --build platforms/linux/linux-qt/build --parallel 2
      - name: Verify native tests and implemented contract vectors
        run: runuser -u xerahs-ci -- ctest --test-dir platforms/linux/linux-qt/build --output-on-failure
      - name: Retain effect failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-effect-failure-diagnostics
          path: platforms/linux/linux-qt/build/effect-diagnostics
          if-no-files-found: ignore

  # CORE-028 / CORE-033: build the linux-qt edition's .tar.gz, .deb and .rpm,
  # install the .deb into a clean system and launch the installed binary.
  # Packages are unsigned build artifacts, not releases.
  linux-qt-packages:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install the Linux packaging toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ qt6-base-dev zlib1g-dev libsqlite3-dev python3 dbus-daemon \
            poppler-utils dpkg-dev file rpm desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate platforms/linux/linux-qt/packaging/com.xerahs.app.desktop
          appstreamcli validate --no-net platforms/linux/linux-qt/packaging/com.xerahs.app.metainfo.xml
      - name: Configure a release build
        run: |
          cmake -S platforms/linux/linux-qt -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
            -DXERAHS_PACKAGE_VERSION="0.0.0~ci${GITHUB_RUN_NUMBER}"
      - name: Build the application
        run: cmake --build build --target xerahs --parallel 2
      - name: Build .tar.gz, .deb and .rpm
        run: cpack --config build/CPackConfig.cmake -B build/packages
      - name: Install the .deb and launch the installed application
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./build/packages/*.deb
          test -x /usr/bin/xerahs
          test -f /usr/share/applications/com.xerahs.app.desktop
          test -f /usr/share/metainfo/com.xerahs.app.metainfo.xml
          QT_QPA_PLATFORM=offscreen xerahs --help
          DEBIAN_FRONTEND=noninteractive apt-get remove -y xerahs
          test ! -e /usr/bin/xerahs
      - name: Inspect the .rpm
        run: rpm -qpil build/packages/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: xerahs-linux-qt-packages
          path: |
            build/packages/*.tar.gz
            build/packages/*.deb
            build/packages/*.rpm
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/contract-linter/lint.py
      - run: python -m unittest discover tools/contract-linter/tests -v
      - run: python tools/contract-backlog/tracker.py --check
      - run: python -m unittest discover tools/contract-backlog/tests -v
      - run: python tools/platform-progress/update.py --check
      - run: python -m unittest discover tools/platform-progress/tests -v
      - run: python -m py_compile tools/baseline-census/census.py
      - name: Effective-instructions report
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          python tools/contract-linter/lint.py --changed-since "$base" | tee -a "$GITHUB_STEP_SUMMARY"
