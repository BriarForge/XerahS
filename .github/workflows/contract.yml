name: Product Contract

# No path filters: TOOL-EFFECTIVE-001 requires an effective-instructions
# report for every changed path, and the checks run in seconds.
on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/contract-linter/lint.py
      - run: python -m unittest discover tools/contract-linter/tests -v
      - run: python tools/contract-backlog/tracker.py --check
      - run: python -m unittest discover tools/contract-backlog/tests -v
      - run: python -m py_compile tools/baseline-census/census.py
      - name: Effective-instructions report
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          python tools/contract-linter/lint.py --changed-since "$base" | tee -a "$GITHUB_STEP_SUMMARY"
